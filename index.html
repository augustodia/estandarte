<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Estandarte</title>
<meta name="description" content="Jogo de estratégia e conquista de territórios para jogar entre celulares, sem servidor.">
<meta name="theme-color" content="#0f1c2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
<main id="app">
  <section id="home" class="screen">
    <div class="crest" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M14 6v52" stroke="#f1e6cf" stroke-width="4" stroke-linecap="round"/><path d="M16 10h34l-8 11 8 11H16z" fill="#d64545"/></svg></div>
    <h1>Estandarte</h1>
    <p class="tag">Conquiste territórios, cumpra seu objetivo secreto.</p>
    <label class="field">Seu nome<input id="name" maxlength="14" autocomplete="off" placeholder="Como quer ser chamado"></label>
    <button class="btn primary" data-do="host">Criar partida</button>
    <button class="btn" data-do="join">Entrar em partida</button>
    <button class="btn" data-do="rejoin" id="rejoin" hidden>Reconectar à partida</button>
    <button class="btn" data-do="resume" id="resume" hidden>Continuar partida salva</button>
    <button class="btn ghost" data-do="rules">Como jogar</button>
    <p class="tag" id="offline" hidden>✓ Pronto para jogar sem internet</p>
    <p class="tag ver" id="ver"></p>
  </section>
  <section id="lobby" class="screen" hidden>
    <h2>Sala</h2>
    <ul id="seats" class="seats"></ul>
    <div id="lobbyActions"></div>
  </section>
  <section id="game" class="screen" hidden>
    <header id="hud"></header>
    <div id="mapwrap"><div id="tilt"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg><canvas id="smoke" hidden></canvas><svg id="map2" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg></div><button id="ring" data-do="menu" hidden></button><button id="evchip" data-do="extras" hidden></button><div id="dice" hidden></div><button id="fit" class="mapbtn" aria-label="Ajustar zoom"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
    <footer id="bar"></footer>
  </section>
</main>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
<div id="win" role="dialog" aria-modal="true" hidden></div>
<div id="flash" role="status" hidden><b></b><small></small></div>
<div id="toast" role="status" hidden></div>
</div>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
