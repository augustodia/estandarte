<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="referrer" content="no-referrer">
  <title>Ultimato</title>
  <meta name="description" content="Jogo de estratégia e conquista de territórios para jogar entre celulares, sem servidor, ou online.">
  <meta name="theme-color" content="#0B0F14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ultimato">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0B0F14;
      color: #E8ECF1;
      overscroll-behavior: none;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0B0F14;
      z-index: 9999;
      transition: opacity .25s ease;
    }
    #boot-splash.hide { opacity: 0; pointer-events: none; }
    #boot-splash h1 {
      margin: 0;
      font-family: "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
      font-weight: 700;
      font-size: 32px;
      letter-spacing: .06em;
      color: #E8ECF1;
    }
    #boot-splash small { color: #9AA4B2; font-size: 13px; letter-spacing: .04em; }
  </style>
</head>
<body>
  <div id="boot-splash">
    <h1>ULTIMATO</h1>
    <small>Carregando motor de regras…</small>
  </div>
  <script src="engine/wasm_exec.js"></script>
  <script>
    if (window.top !== window.self) {
      try { window.top.location = location.href; }
      catch (e) { document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">Abra o Ultimato direto no navegador.</p>'; }
    }
    window.__estandarteEngineReady = (async function () {
      if (window.estandarteEngine) return true;
      const go = new Go();
      let result;
      try {
        if (WebAssembly.instantiateStreaming) {
          result = await WebAssembly.instantiateStreaming(fetch('engine/estandarte.wasm'), go.importObject);
        } else {
          throw new Error('no-streaming');
        }
      } catch (_) {
        const resp = await fetch('engine/estandarte.wasm');
        const buf = await resp.arrayBuffer();
        result = await WebAssembly.instantiate(buf, go.importObject);
      }
      go.run(result.instance);
      for (let i = 0; i < 200; i++) {
        if (window.estandarteEngine) return true;
        await new Promise((r) => setTimeout(r, 10));
      }
      throw new Error('Motor Go WASM não respondeu.');
    })();
    window.addEventListener('flutter-first-frame', function () {
      const s = document.getElementById('boot-splash');
      if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 300); }
    });
  </script>
  <script>
    (async function purgeLegacySw() {
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(
            keys
              .filter((k) => /^estandarte/i.test(k))
              .map((k) => caches.delete(k))
          );
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          let removedLegacy = false;
          for (const reg of regs) {
            const url =
              (reg.active && reg.active.scriptURL) ||
              (reg.waiting && reg.waiting.scriptURL) ||
              (reg.installing && reg.installing.scriptURL) ||
              '';
            if (!url.includes('flutter_service_worker.js')) {
              await reg.unregister();
              removedLegacy = true;
            }
          }
          const ctrlUrl =
            navigator.serviceWorker.controller &&
            navigator.serviceWorker.controller.scriptURL;
          if (
            removedLegacy &&
            ctrlUrl &&
            !ctrlUrl.includes('flutter_service_worker.js') &&
            !sessionStorage.getItem('ultimato_sw_migrated')
          ) {
            sessionStorage.setItem('ultimato_sw_migrated', '1');
            location.reload();
          }
        }
      } catch (_) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
